<h2 class="text-2xl font-bold mb-4">Mesas</h2>

<div class="grid grid-cols-3 gap-2 mb-4 text-center">
    <div class="bg-green-100 rounded p-2">
        <p class="text-xs text-green-800">Libres</p>
        <p class="font-bold text-lg">{{ libres() }}</p>
    </div>
    <div class="bg-red-100 rounded p-2">
        <p class="text-xs text-red-800">Ocupadas</p>
        <p class="font-bold text-lg">{{ ocupadas() }}</p>
    </div>
    <div class="bg-yellow-100 rounded p-2">
        <p class="text-xs text-yellow-800">Reservadas</p>
        <p class="font-bold text-lg">{{ reservadas() }}</p>
    </div>
</div>

<div class="grid grid-cols-2 md:grid-cols-4 gap-3">
    @for (m of mesas(); track m.id) {
    <div appEstadoMesa [estado]="m.estado" class="border rounded p-4 shadow-sm">
        <p class="text-lg font-bold">Mesa {{ m.numero }}</p>
        <p class="text-sm text-gray-700">Capacidad: {{ m.capacidad }}</p>
        <p class="text-xs capitalize mt-1">{{ m.estado }}</p>
    </div>
    }
</div>
