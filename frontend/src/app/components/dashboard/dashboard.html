<h2 class="text-2xl font-bold mb-4">Dashboard</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    <div class="bg-blue-100 rounded p-4 shadow-sm">
        <p class="text-sm text-blue-900">Importe de pedidos</p>
        <p class="text-2xl font-bold">{{ totalVentas() | monedaBs }}</p>
    </div>
    <div class="bg-green-100 rounded p-4 shadow-sm">
        <p class="text-sm text-green-900">Pedidos registrados</p>
        <p class="text-2xl font-bold">{{ pedidosHoy() }}</p>
    </div>
    <div class="bg-red-100 rounded p-4 shadow-sm">
        <p class="text-sm text-red-900">Mesas con pedidos activos</p>
        <p class="text-2xl font-bold">{{ mesasOcupadas() }}</p>
    </div>
    <div class="bg-yellow-100 rounded p-4 shadow-sm">
        <p class="text-sm text-yellow-900">Platillos disponibles</p>
        <p class="text-2xl font-bold">{{ platillosDisponibles() }}</p>
    </div>
</div>
